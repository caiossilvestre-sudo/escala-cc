<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Suporte Técnico mudou de endereço</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { --bg:#F4F5F7; --card:#FFFFFF; --text:#1B1D22; --muted:#6B7280; --border:#E5E7EB; --primary:#E8752E; --primary-dark:#D2631F; --soft:#FFF4EC; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161A; --card:#1E2127; --text:#F2F3F5; --muted:#9AA1AD; --border:#2C3038; --soft:#2A2018; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
           background:var(--bg); color:var(--text); font-family:Inter,"Segoe UI",Arial,sans-serif; }
    .card { width:100%; max-width:460px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px 28px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.06); }
    .logo { width:52px; height:52px; border-radius:14px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,#E8752E,#F0A268); color:#fff; font-weight:700; font-size:20px; }
    h1 { margin:0 0 6px; font-size:20px; }
    .sub { margin:0 0 20px; font-size:13px; color:var(--muted); }
    p { margin:0 0 16px; font-size:14.5px; line-height:1.55; }
    .novo { display:block; margin:0 0 22px; padding:12px 14px; border-radius:10px; background:var(--soft); border:1px solid var(--border);
            font-family:Consolas,monospace; font-size:13.5px; word-break:break-all; color:var(--primary-dark); text-decoration:none; }
    .btn { display:inline-block; width:100%; padding:13px 18px; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; font-size:15px; text-decoration:none; }
    .btn:hover { background:var(--primary-dark); }
    .dica { margin:18px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">ST</div>
    <h1>Suporte Técnico mudou de endereço</h1>
    <p class="sub">Sistemas</p>
    <p>Este endereço não é mais usado. O sistema continua o mesmo, só mudou de lugar. Use o novo link:</p>
    <a class="novo" href="https://suporte-tecnico.silvertec.net.br/">suporte-tecnico.silvertec.net.br</a>
    <a class="btn" href="https://suporte-tecnico.silvertec.net.br/">Acessar o novo endereço</a>
    <p class="dica">Atualize seus favoritos. No endereço novo você precisará entrar de novo com seu e-mail e senha.</p>
  </main>
</body>
</html>
